name: Deploy GitHub Pages previews

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build site-antd
        run: pnpm build:site-antd
        env:
          VITE_BASE_URL: /fast-vue3/

      - name: Build web-antd
        run: pnpm build:web-antd
        env:
          VITE_BASE_URL: /fast-vue3/web-antd/
          VITE_APP_API_BASEURL: ${{ vars.VITE_APP_API_BASEURL || '/api/v1' }}

      - name: Assemble Pages artifact
        run: |
          mkdir -p pages/web-antd
          cp -R apps/site-antd/dist/. pages/
          cp -R apps/web-antd/dist/. pages/web-antd/
          cp pages/index.html pages/404.html
          touch pages/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
